<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arena · Telão da Competição</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
  <script src="js/theme.js"></script>
  <script src="js/config.js"></script>
  <script>if (ARENA_CONFIG.supabaseUrl) document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>');</script>
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo" id="logo"></div>
        <div>
          <div class="comp-title" id="compName">Arena</div>
          <div class="comp-sub" id="compSub">Carregando…</div>
        </div>
      </div>
      <div class="spacer"></div>
      <span class="live" id="liveBadge"><i></i><span>AO VIVO</span></span>
      <select class="input hide-fs" id="compSelect" style="width:auto;min-width:200px" aria-label="Competição"></select>
      <button class="btn theme-btn hide-fs" data-theme-toggle type="button">☀️</button>
      <button class="btn hide-fs" id="fsBtn" title="Tela cheia (F)">⛶ Tela cheia</button>
    </header>

    <div id="champion"></div>

    <main class="grid" id="main">
      <section class="col">
        <div class="card teams-card">
          <div class="card-h">Ranking por time <small>quem lidera é o time campeão</small></div>
          <div class="team-list" id="teamList"></div>
        </div>
        <div class="card players-card">
          <div class="card-h">Ranking individual <small id="playersCount"></small></div>
          <div class="players-scroll" id="playersScroll"><table class="rank" id="playersTable"></table></div>
        </div>
      </section>
      <section class="card bracket-card">
        <div class="card-h">Mata-mata <small id="bracketInfo"></small></div>
        <div id="nextBattle"></div>
        <div class="bracket-viewport" id="viewport"></div>
      </section>
    </main>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/bracket-view.js"></script>
  <script src="js/public.js"></script>
</body>
</html>
